name: Publish Any Commit

on:
  push:
    # `changesets/action` v2 pushes through the GitHub API, which first creates a transient
    # `changesets-ghcommit-temp/<branch>` ref; CI on that ref only produces runs that cancel each
    # other and cancelled checks attached to the real commit
    branches-ignore:
      - 'changesets-ghcommit-temp/**'
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run for a main commit
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn --immutable

      - name: Build
        run: yarn build

      - name: Publish
        run: yarn dlx pkg-pr-new publish --compact
